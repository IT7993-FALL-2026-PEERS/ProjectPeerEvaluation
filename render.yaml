# Render.com Blueprint documenting the four live services: a backend
# (Docker web service) and a frontend (static site), each duplicated into a
# staging pair and a production pair. Render reads this file when you create
# a Blueprint-based service (Dashboard -> New -> Blueprint) or sync an
# existing Blueprint instance; it does nothing on its own otherwise.
#
# All four services below were created directly via the Render API, not by
# syncing this file, so treat this as source-of-truth documentation of their
# shape (and a way to spin up a fresh, independent instance) rather than
# something that already controls them -- syncing this Blueprint against the
# same account will try to create four NEW same-named services, not adopt
# the existing ones.
#
# Deploys are driven by GitHub Actions via a Render Deploy Hook per service,
# not by Render's own git-push auto-deploy -- that must stay Off on all four
# services for the CI gating to mean anything:
#   - peer-evaluation-backend-staging / peer-evaluation-frontend-staging:
#     deployed automatically by .github/workflows/backend-ci-cd.yml and
#     frontend-ci-cd.yml respectively, on every push, gated on that app's
#     own unit + integration tests.
#   - peer-evaluation-backend-production / peer-evaluation-frontend-production:
#     deployed by .github/workflows/deploy-production.yml, which triggers
#     itself automatically right after the matching staging deploy
#     succeeds, runs that app's tests again, then pauses for a
#     required-reviewer approval click (GitHub Environments
#     production-backend / production-frontend) before actually deploying --
#     see that workflow's header for the full mechanism and its fallback
#     manual triggers.
services:
  - type: web
    name: peer-evaluation-backend-staging
    runtime: docker
    branch: with-test-coverage
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: staging
      # A MongoDB Atlas connection string, pointed at a database distinct
      # from production's (e.g. .../peer-evaluation-staging?...) so staging
      # traffic and test data never touch real production data -- same
      # cluster and credentials as production is fine, only the database
      # name in the URI needs to differ. `sync: false` means Render prompts
      # for this value during Blueprint setup rather than storing it here in
      # git; this is a real secret, not the same value docker-compose.yml
      # uses for local dev, which points at a plain local mongo container.
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://peer-evaluation-frontend-staging.onrender.com

  - type: web
    name: peer-evaluation-backend-production
    runtime: docker
    branch: main
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # The real production database -- the same MONGODB_URI already used
      # by the account's original backend service, so promoting to this
      # service doesn't strand existing professor/course/evaluation data.
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        value: https://peer-evaluation-frontend-production.onrender.com

  # React frontend, self-contained under src/frontend (its own package.json,
  # public/, src/, Dockerfile -- see src/frontend/Dockerfile), matching
  # src/backend's layout. Render's static-site builds run from the repo
  # root regardless, so the buildCommand cds in and staticPublishPath points
  # back out at src/frontend/build. Served as static files with an SPA
  # rewrite so client-side routes like /evaluate/<token> load index.html
  # instead of 404ing on refresh/deep links.
  #
  # The buildCommand writes Render's own RENDER_GIT_COMMIT (available at
  # build time) to public/version.txt before building; CRA copies public/*
  # verbatim into build/, so GET /version.txt on the deployed site reports
  # exactly which commit is live -- the frontend equivalent of the backend's
  # /api/health `commit` field, since a static site has no running process
  # to ask. frontend-ci-cd.yml and deploy-production.yml poll it after
  # triggering a deploy.
  - type: web
    name: peer-evaluation-frontend-staging
    runtime: static
    branch: with-test-coverage
    buildCommand: cd src/frontend && echo "$RENDER_GIT_COMMIT" > public/version.txt && npm install && npm run build
    staticPublishPath: ./src/frontend/build
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # REACT_APP_* values are baked in at build time (see
      # src/frontend/src/config.js), so changing either later requires
      # re-deploying the site.
      - key: REACT_APP_API_URL
        value: https://peer-evaluation-backend-staging.onrender.com/api
      - key: REACT_APP_FRONTEND_URL
        value: https://peer-evaluation-frontend-staging.onrender.com

  - type: web
    name: peer-evaluation-frontend-production
    runtime: static
    branch: main
    buildCommand: cd src/frontend && echo "$RENDER_GIT_COMMIT" > public/version.txt && npm install && npm run build
    staticPublishPath: ./src/frontend/build
    autoDeploy: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://peer-evaluation-backend-production.onrender.com/api
      - key: REACT_APP_FRONTEND_URL
        value: https://peer-evaluation-frontend-production.onrender.com
