# Render Blueprint for the PEERS staging environment.
# Schema: https://render.com/schema/render.yaml.json
#
# Two services, built from `main`:
#   peers-frontend-staging  React static site (free)
#   peers-backend-staging   Express API (Starter plan, so it doesn't sleep and can send SMTP;
#                           free web services block outbound ports 25/465/587)
# The database is MongoDB Atlas (Render doesn't host MongoDB). Allow Render's outbound IPs
# for this region in Atlas > Network Access rather than 0.0.0.0/0.
#
# Secrets marked `sync: false` are entered once in the Render dashboard when the Blueprint
# is first applied, and are never stored in this file.

services:
  - type: web
    name: peers-backend-staging
    runtime: node
    plan: starter
    region: virginia # closest to an Atlas cluster in AWS us-east-1
    branch: main
    rootDir: src/backend
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /api/health
    # Render never deploys on its own: .github/workflows/cd.yml deploys main with this
    # service's deploy hook once CI passes (CICD-12). Build minutes are limited (500/month),
    # so cd.yml only deploys when a file the backend uses changed; the paths that used to be
    # this service's buildFilter are in scripts/render-deploy.js.
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: "24" # keep in sync with .nvmrc
      - key: NODE_ENV
        value: production
      # Turns on the staging email guard (src/backend/utils/emailGuard.js, CICD-44).
      - key: DEPLOY_ENV
        value: staging
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      # Links in invitation and reset emails point here.
      - key: FRONTEND_URL
        value: https://peers-frontend-staging.onrender.com
      # Staging must never email real students. The backend enforces it: with
      # DEPLOY_ENV=staging it refuses to send unless SMTP_HOST is the Mailtrap
      # sandbox (sandbox.smtp.mailtrap.io) and SMTP_SERVICE is unset.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Wait between emails in a batch. Mailtrap's free sandbox allows 1 email per
      # 10 seconds and rejects faster sends with "550 Too many emails per second"
      # (1.5s and 3s both failed on staging). 11s leaves a margin, but one request
      # must finish inside the frontend's 3-minute timeout, so the backend refuses
      # a send of more than 14 recipients (EMAIL_REQUEST_BUDGET_MS, default 150 s)
      # and tells the professor to send team by team.
      - key: EMAIL_SEND_INTERVAL_MS
        value: "11000"

  - type: web
    name: peers-frontend-staging
    runtime: static
    branch: main
    # version.txt holds the built commit, so cd.yml can tell when a deploy is live (the
    # backend reports its commit in /api/health instead).
    buildCommand: npm ci && npm run build && printf '%s\n' "$RENDER_GIT_COMMIT" > build/version.txt
    staticPublishPath: ./build
    # Deployed by cd.yml only, like the backend. Its old buildFilter paths are in
    # scripts/render-deploy.js.
    autoDeployTrigger: "off"
    # React Router handles paths like /evaluate/:token in the browser.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24" # keep in sync with .nvmrc
      # Baked into the bundle at build time (see src/frontend/services/apiUrl.js).
      # fromService only exposes a bare host, so the full URL is written out here;
      # check it matches the backend's URL after the first deploy.
      - key: REACT_APP_API_URL
        value: https://peers-backend-staging.onrender.com/api
