# Render.com Blueprint for the backend API (Docker web service) and the
# frontend (static site). Render reads this file when you
# create a Blueprint-based service (Dashboard -> New -> Blueprint) or sync
# an existing Blueprint instance; it does nothing on its own otherwise.
#
# Note this defines a NEW service by name -- it does not adopt/reconfigure
# an already-existing, manually-created Render service (like the current
# production service, peer-evaluation-backend-rd6z, whose "-rd6z" suffix
# exists specifically because "peer-evaluation-backend" was already taken).
# Switching that existing service to Docker was instead done manually via
# its own Settings -> Build -> Edit Source, which preserves its URL, env
# vars, and deploy history -- see DEPLOYMENT_GUIDE.md for those steps. Use
# this file as source-of-truth documentation of the service's shape, or to
# spin up a genuinely new/second instance.
#
# Deploys of the real production service are driven by
# .github/workflows/ci-cd.yml's `deploy` job via a Render Deploy Hook, not
# by Render's own git-push auto-deploy -- that must stay set to Off on the
# service for the CI gating to mean anything (see the workflow file).
services:
  - type: web
    name: peer-evaluation-backend
    runtime: docker
    dockerfilePath: ./src/backend/Dockerfile
    dockerContext: ./src/backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # A MongoDB Atlas connection string: mongodb+srv://<user>:<password>@
      # <cluster>.mongodb.net/<database>?retryWrites=true&w=majority. From
      # the Atlas dashboard: Database -> Connect -> Drivers -> copy the
      # connection string, substitute your database user's password, and
      # make sure Network Access allows connections from anywhere (0.0.0.0/0)
      # or specifically from Render's IPs, since Render's outbound IPs
      # aren't static on the free plan. `sync: false` means Render prompts
      # for this value during Blueprint setup rather than storing it here in
      # git -- this is a real secret, not the same value docker-compose.yml
      # uses for local dev, which points at a plain local mongo container.
      - key: MONGODB_URI
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false

  # React frontend, built with react-scripts from the repo root (package.json
  # and public/ live at the root; source is under src/, not src/frontend/) and
  # served as static files. The SPA rewrite makes client-side routes like
  # /evaluate/<token> load index.html instead of 404ing on refresh/deep links.
  #
  # Auto-deploy is left on here: unlike the backend, no CI deploy hook is
  # wired up for the frontend.
  - type: web
    name: peer-evaluation-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # REACT_APP_* values are baked in at build time (see src/frontend/
      # config.js). Set REACT_APP_API_URL to the deployed backend's URL plus
      # /api, e.g. https://peer-evaluation-backend-rd6z.onrender.com/api --
      # Render prompts for it during Blueprint setup. Changing it later
      # requires re-deploying the static site.
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_FRONTEND_URL
        sync: false
