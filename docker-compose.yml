# Local dev stack for the backend API. The frontend has no Dockerfile yet
# and runs separately via `npm start` in src/frontend against this backend.
services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./src/backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/peer-evaluation
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongo

volumes:
  mongo_data:
