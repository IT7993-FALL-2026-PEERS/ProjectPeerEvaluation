name: CI

# The job names below (`name:`) are the required status checks in the `main` branch ruleset.
# Renaming a job means updating the ruleset too, or merges will wait for a check that never runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded pull request runs. Never cancel a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json

      # The root postinstall script also installs the backend dependencies.
      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Jest + React Testing Library)
        run: npm test -- --watchAll=false
        env:
          CI: true

      # CI=true makes Create React App treat lint warnings as errors.
      - name: Build
        run: npm run build
        env:
          CI: true

  backend:
    name: Backend (install + syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Placeholder until backend tests exist: fail on any file that does not parse.
      - name: Syntax check
        run: find . -name node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Lints the workflow files themselves, so a YAML or expression mistake fails here
  # instead of at the next run.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
