name: CI

# The job names below (`name:`) are the required status checks in the `main` branch ruleset.
# Renaming a job means updating the ruleset too, or merges will wait for a check that never runs.
#
# Runners are pinned to ubuntu-24.04: GitHub moves `ubuntu-latest` to Ubuntu 26.04 from 19 Oct 2026
# (backlog CICD-54). Change the label on a test branch first, then here, once MongoDB, Playwright and
# Docker are green on it.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded pull request runs. Never cancel a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json

      # The root postinstall script also installs the backend dependencies.
      - name: Install dependencies
        run: npm ci

      # The lint gate. The build does not lint (CRA's build used to; Vite's does not), and this
      # step also covers src/index.jsx and src/setupTests.js.
      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit tests (Vitest + React Testing Library)
        id: unit
        run: |
          mkdir -p reports
          npm test -- --coverage --reporter=default --reporter=json --outputFile.json=reports/frontend-tests.json
        env:
          CI: true

      # Tests run, passed, failed, skipped and duration, in the job summary (backlog CICD-29).
      # Runs after a failed test step too, so the summary shows what failed. Vitest writes the
      # same JSON shape as Jest, which is why the format below is still called jest.
      - name: Test summary (frontend)
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        run: node scripts/test-summary.js "Frontend unit tests" jest reports/frontend-tests.json

      # Fails when frontend coverage drops below the floors in coverage-floors.json and
      # writes the numbers to the job summary. Floors only go up.
      - name: Coverage gate (frontend)
        run: node scripts/coverage-gate.js frontend

      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Upload frontend coverage and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-frontend
          path: |
            coverage/
            reports/
          retention-days: 30
          if-no-files-found: ignore

  backend:
    name: Backend (install + syntax check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint 10 recommended rules (src/backend/eslint.config.js). Catches bugs like
      # a duplicate object key, which silently drops the first value (API-8).
      - name: Lint (ESLint)
        run: npm run lint

      # Catches files that don't parse, including ones no test loads yet.
      - name: Syntax check
        run: find . -name node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      # Runs every tests/**/*.test.js, so a new test file is picked up without
      # touching this workflow. Measures coverage over the source folders in the same run.
      - name: Backend tests (node:test, with coverage)
        id: unit
        run: npm run test:coverage

      - name: Test summary (backend)
        if: ${{ !cancelled() && steps.unit.outcome != 'skipped' }}
        run: node ../../scripts/test-summary.js "Backend unit tests" node reports/backend-tests.xml

      # Fails when backend coverage drops below the floors in coverage-floors.json and
      # writes the numbers to the job summary. Floors only go up.
      - name: Coverage gate (backend)
        run: node ../../scripts/coverage-gate.js backend

      - name: Upload backend coverage and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-backend
          path: |
            src/backend/coverage/
            src/backend/reports/
          retention-days: 30
          if-no-files-found: ignore

  # End-to-end workflows in a real browser against the real app (backlog CICD-26): the backend on a
  # throwaway MongoDB with email captured, and the production frontend build. See playwright.config.js.
  e2e-smoke:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      MONGOMS_USE_ARCHIVE_NAME_FOR_BINARY_NAME: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The end-to-end servers serve this build.
      - name: Build the frontend
        run: npm run build
        env:
          CI: true

      # Same key as the integration job: the MongoDB binary the in-memory database needs.
      - name: Work out the MongoDB binary cache key
        id: mongo
        run: |
          version=$(node -p "require('./src/backend/integration/helpers/db').ATLAS_MONGODB_VERSION")
          release=$(. /etc/os-release && echo "$VERSION_ID")
          echo "key=mongod-${RUNNER_OS}-${RUNNER_ARCH}-ubuntu${release}-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mongodb-binaries
          key: ${{ steps.mongo.outputs.key }}

      - name: Run Playwright tests
        id: e2e
        run: npm run test:e2e
        env:
          E2E_START_SERVER: "1"

      # Playwright's json reporter (playwright.config.js) writes the results this reads.
      - name: Test summary (end-to-end)
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: node scripts/test-summary.js "End-to-end tests" playwright playwright-results/results.json

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright-results/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Builds both images and starts the Compose stack the way a fresh clone would, then checks
  # the backend (which needs MongoDB) and the frontend answer. A required check in the `main`
  # ruleset, like the others (backlog CICD-25).
  containers:
    name: Containers (build + compose smoke)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Same step a new teammate runs: creates the root .env with a random JWT_SECRET.
      - name: Create .env (scripts/setup.js)
        run: node scripts/setup.js --env-only

      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300

      - name: Smoke check (backend and frontend)
        run: bash scripts/verify-env.sh

      # The health route answers 503 when MongoDB is not connected, and curl -f turns that
      # into a failure above; this also checks the body, so a changed route cannot pass quietly.
      - name: Health body reports the database connected
        run: |
          body=$(curl -sf http://localhost:5000/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"OK"'

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker compose ps -a && docker compose logs --no-color --tail 100

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v

  # Backend integration tests against a real MongoDB started by mongodb-memory-server in
  # replica-set mode, pinned to the staging Atlas version (ADR 0001, backlog CICD-21). Report-only
  # until it has been stable for a while; then it becomes a required check.
  integration:
    name: Integration (real MongoDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    env:
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
      # The default binary name leaves out the Ubuntu release; this puts the archive name in it.
      MONGOMS_USE_ARCHIVE_NAME_FOR_BINARY_NAME: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The key names everything that decides which binary is downloaded.
      - name: Work out the MongoDB binary cache key
        id: mongo
        run: |
          version=$(node -p "require('./integration/helpers/db').ATLAS_MONGODB_VERSION")
          release=$(. /etc/os-release && echo "$VERSION_ID")
          echo "key=mongod-${RUNNER_OS}-${RUNNER_ARCH}-ubuntu${release}-${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mongodb-binaries
          key: ${{ steps.mongo.outputs.key }}

      - name: Integration tests
        id: integration
        run: npm run test:integration

      - name: Test summary (integration)
        if: ${{ !cancelled() && steps.integration.outcome != 'skipped' }}
        run: node ../../scripts/test-summary.js "Integration tests" node reports/integration-tests.xml

      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-results
          path: src/backend/reports/
          retention-days: 30
          if-no-files-found: ignore

  # Run overview and build history in the summary of every CI run (backlog CICD-29). Test counts,
  # durations and coverage are in each job's own section; this adds the result and duration of every
  # job and the outcome of the latest runs. It reports only, so it is not a required check.
  report:
    name: Run report (overview + build history)
    needs: [frontend, backend, e2e-smoke, containers, integration, workflow-lint]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Fetch this run's jobs and the latest runs
        run: |
          mkdir -p reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > reports/run-jobs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --limit 10 \
            --json databaseId,headBranch,headSha,event,status,conclusion,createdAt,updatedAt,url > reports/run-history.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}

      - name: Write the report
        run: node scripts/run-report.js reports/run-jobs.json reports/run-history.json "$RUN_ID" "$SELF"
        env:
          RUN_ID: ${{ github.run_id }}
          SELF: Run report (overview + build history)

      - name: Upload run report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  # Lints the workflow files themselves, so a YAML or expression mistake fails here
  # instead of at the next run.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
