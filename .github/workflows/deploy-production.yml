# Production deploy: promotes the backend and/or frontend to
# peer-evaluation-backend-production / peer-evaluation-frontend-production.
#
# Fully automated, with one deliberate checkpoint: this workflow fires on
# its own right after backend-ci-cd.yml / frontend-ci-cd.yml successfully
# deploys that app to STAGING (via the workflow_run trigger below) -- no
# script, no tag, no button. It runs that app's tests again, then pauses at
# the deploy-backend / deploy-frontend job (each targets a GitHub
# Environment -- production-backend / production-frontend -- configured
# with a required reviewer) until a human clicks Approve on the run in the
# Actions tab. That's the only manual step left; everything else is
# automatic. Backend and frontend promote independently of each other,
# same as before.
#
# Can still be triggered manually two other ways, kept as fallbacks (e.g.
# to re-promote production without a new staging run):
#   scripts/deploy-to-production.sh backend    # tags & pushes deploy-backend-production-<timestamp>
#   scripts/deploy-to-production.sh frontend   # tags & pushes deploy-frontend-production-<timestamp>
#   scripts/deploy-to-production.sh both       # both of the above
# ...or the Actions tab's "Run workflow" button / `gh workflow run
# deploy-production.yml --ref with-test-coverage`. All three trigger types
# (tag push, workflow_dispatch, workflow_run) still land on the same
# required-reviewer gate below -- automation changes *how* a deploy starts,
# never whether a human approves it.
#
# Why workflow_run works here without touching main: this repo intentionally
# keeps `main` and `with-test-coverage` separate (main has its own,
# independently-evolving CI/test setup). A workflow that has NEVER run isn't
# known to GitHub at all -- unless its file exists on the repo's default
# branch (main here). But workflow_run and workflow_dispatch both need this
# workflow to be a *registered* workflow (i.e. it needs to have run once,
# via any trigger), not specifically to live on the default branch forever
# -- confirmed by testing workflow_dispatch on backend-ci-cd.yml. This
# workflow bootstrapped its registration via a tag push before workflow_run
# was added; now that it's registered, workflow_run fires correctly from
# with-test-coverage with no main involvement.
#
# Required repo secrets: RENDER_BACKEND_PRODUCTION_DEPLOY_HOOK_URL,
# RENDER_FRONTEND_PRODUCTION_DEPLOY_HOOK_URL (Render dashboard -> each
# *-production service -> Settings -> Deploy Hook). Both services' own
# Auto-Deploy must stay OFF, for the same reason given in backend-ci-cd.yml
# -- doubly so here, since Auto-Deploy would push every commit straight to
# production with no test gate and no approval at all.
#
# Required environments (Settings -> Environments): production-backend,
# production-frontend, each with a required reviewer. Created via the API
# with dgobin-ksu as reviewer, prevent_self_review off (a solo-maintainer
# project can't require a *different* approver from whoever pushed) and no
# branch restriction (deploys happen from with-test-coverage, not main).

name: Deploy to production

on:
  push:
    tags:
      - 'deploy-backend-production-*'
      - 'deploy-frontend-production-*'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend to peer-evaluation-backend-production'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend to peer-evaluation-frontend-production'
        type: boolean
        default: true
  workflow_run:
    workflows: ['Backend CI/CD (staging)', 'Frontend CI/CD (staging)']
    types: [completed]

jobs:
  backend-unit-tests:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_backend) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/deploy-backend-production-')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Backend CI/CD (staging)' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      # workflow_run's default checkout would otherwise use the default
      # branch's HEAD, not the commit backend-ci-cd.yml actually just tested
      # and deployed to staging -- pin explicitly for every trigger type.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  backend-integration-tests:
    needs: backend-unit-tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: src/backend
    env:
      # See backend-ci-cd.yml for why this is job-scoped, not workflow-wide.
      MONGODB_URI: mongodb://127.0.0.1:27017/peer-evaluation-integration-test
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  deploy-backend:
    needs: backend-integration-tests
    runs-on: ubuntu-latest
    # Pauses here until dgobin-ksu clicks Approve on this run in the Actions
    # tab (Settings -> Environments -> production-backend's required
    # reviewer) -- the one manual step in an otherwise fully automatic
    # pipeline.
    environment: production-backend
    env:
      # Job-scoped, not workflow-wide: emailUtils.js reads process.env.
      # FRONTEND_URL directly, so setting it workflow-wide leaked it into
      # backend-unit-tests too, silently pinning that branch of
      # `process.env.FRONTEND_URL || frontendUrl` and failing the 100%
      # branch-coverage threshold -- the exact same category of mistake the
      # MONGODB_URI job-scoping comments elsewhere already warn about.
      # Confirmed locally: `FRONTEND_URL=<anything> npm run test:unit` fails
      # that threshold; unset, it passes.
      BACKEND_URL: https://peer-evaluation-backend-production.onrender.com
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Trigger Render production deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_PRODUCTION_DEPLOY_HOOK_URL }}&ref=${{ env.DEPLOY_SHA }}"
      - name: Wait for the new commit to go live
        run: |
          for i in $(seq 1 40); do
            body="$(curl -fsS "$BACKEND_URL/api/health" || true)"
            live_commit="$(echo "$body" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)"
            echo "Attempt $i: live commit is ${live_commit:-<none>}, waiting for $DEPLOY_SHA"
            case "$live_commit" in
              "$DEPLOY_SHA"*) echo "New commit is live."; exit 0 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for commit $DEPLOY_SHA to go live."
          exit 1

  frontend-unit-tests:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/deploy-frontend-production-')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Frontend CI/CD (staging)' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  frontend-integration-tests:
    needs: frontend-unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  deploy-frontend:
    needs: frontend-integration-tests
    runs-on: ubuntu-latest
    # Pauses here until dgobin-ksu clicks Approve -- see deploy-backend's
    # environment comment above.
    environment: production-frontend
    env:
      # Job-scoped, not workflow-wide -- see deploy-backend's BACKEND_URL
      # comment above for why (this is the var that actually caused it).
      FRONTEND_URL: https://peer-evaluation-frontend-production.onrender.com
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Trigger Render production deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_PRODUCTION_DEPLOY_HOOK_URL }}&ref=${{ env.DEPLOY_SHA }}"
      # See frontend-ci-cd.yml for why this polls /version.txt.
      - name: Wait for the new commit to go live
        run: |
          for i in $(seq 1 40); do
            live_commit="$(curl -fsS "$FRONTEND_URL/version.txt" || true)"
            echo "Attempt $i: live commit is ${live_commit:-<none>}, waiting for $DEPLOY_SHA"
            case "$live_commit" in
              "$DEPLOY_SHA"*) echo "New commit is live."; exit 0 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for commit $DEPLOY_SHA to go live."
          exit 1
