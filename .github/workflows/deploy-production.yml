# Manual production deploy: promotes the backend and/or frontend to
# peer-evaluation-backend-production / peer-evaluation-frontend-production.
#
# Unlike backend-ci-cd.yml / frontend-ci-cd.yml (which deploy to STAGING
# automatically on every push, gated on their own tests), this pipeline only
# runs when a human deliberately triggers it, and lets them deploy the
# backend and the frontend independently of each other -- e.g. promote a
# backend fix to production without also re-deploying an unrelated frontend
# change, or vice versa. It still runs the same unit + integration tests
# first for whichever app is being promoted, as a safety gate -- "manual"
# means a human decides *when* and *what* to promote, not that untested code
# can reach production.
#
# Triggered by pushing a tag, not (only) workflow_dispatch's "Run workflow"
# button: this repo intentionally keeps `main` and `with-test-coverage`
# separate (main has its own, independently-evolving CI/test setup), and a
# workflow that has NEVER run isn't known to GitHub at all -- it 404s from
# the API and has no "Run workflow" button -- unless its file exists on the
# repo's default branch (main here). A tag push has no such restriction:
# GitHub runs whatever workflow files exist at the pushed ref, on any
# branch, so this works today without putting anything from this branch
# onto main. See scripts/deploy-to-production.sh, which tags and pushes for
# you:
#
#   scripts/deploy-to-production.sh backend    # tags & pushes deploy-backend-production-<timestamp>
#   scripts/deploy-to-production.sh frontend   # tags & pushes deploy-frontend-production-<timestamp>
#   scripts/deploy-to-production.sh both       # both of the above
#
# Once this workflow has run at least once (i.e. after the first tag push),
# GitHub knows about it and workflow_dispatch (the "Run workflow" button, or
# `gh workflow run deploy-production.yml --ref with-test-coverage`) starts
# working too, from this branch, without needing main -- confirmed by
# testing the same thing on backend-ci-cd.yml. The tag push is only required
# to bootstrap that; after that, either mechanism works.
#
# Required repo secrets: RENDER_BACKEND_PRODUCTION_DEPLOY_HOOK_URL,
# RENDER_FRONTEND_PRODUCTION_DEPLOY_HOOK_URL (Render dashboard -> each
# *-production service -> Settings -> Deploy Hook). Both services' own
# Auto-Deploy must stay OFF, for the same reason given in backend-ci-cd.yml
# -- doubly so here, since Auto-Deploy would push every commit straight to
# production with no test gate and no human trigger at all.

name: Deploy to production (manual)

on:
  push:
    tags:
      - 'deploy-backend-production-*'
      - 'deploy-frontend-production-*'
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend to peer-evaluation-backend-production'
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend to peer-evaluation-frontend-production'
        type: boolean
        default: true

jobs:
  backend-unit-tests:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_backend) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/deploy-backend-production-'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  backend-integration-tests:
    needs: backend-unit-tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: src/backend
    env:
      # See backend-ci-cd.yml for why this is job-scoped, not workflow-wide.
      MONGODB_URI: mongodb://127.0.0.1:27017/peer-evaluation-integration-test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  deploy-backend:
    needs: backend-integration-tests
    runs-on: ubuntu-latest
    env:
      # Job-scoped, not workflow-wide: emailUtils.js reads process.env.
      # FRONTEND_URL directly, so setting it workflow-wide leaked it into
      # backend-unit-tests too, silently pinning that branch of
      # `process.env.FRONTEND_URL || frontendUrl` and failing the 100%
      # branch-coverage threshold -- the exact same category of mistake the
      # MONGODB_URI job-scoping comments elsewhere already warn about.
      # Confirmed locally: `FRONTEND_URL=<anything> npm run test:unit` fails
      # that threshold; unset, it passes.
      BACKEND_URL: https://peer-evaluation-backend-production.onrender.com
    steps:
      - name: Trigger Render production deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_PRODUCTION_DEPLOY_HOOK_URL }}&ref=${{ github.sha }}"
      - name: Wait for the new commit to go live
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 40); do
            body="$(curl -fsS "$BACKEND_URL/api/health" || true)"
            live_commit="$(echo "$body" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)"
            echo "Attempt $i: live commit is ${live_commit:-<none>}, waiting for $EXPECTED_SHA"
            case "$live_commit" in
              "$EXPECTED_SHA"*) echo "New commit is live."; exit 0 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for commit $EXPECTED_SHA to go live."
          exit 1

  frontend-unit-tests:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy_frontend) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/deploy-frontend-production-'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  frontend-integration-tests:
    needs: frontend-unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  deploy-frontend:
    needs: frontend-integration-tests
    runs-on: ubuntu-latest
    env:
      # Job-scoped, not workflow-wide -- see deploy-backend's BACKEND_URL
      # comment above for why (this is the var that actually caused it).
      FRONTEND_URL: https://peer-evaluation-frontend-production.onrender.com
    steps:
      - name: Trigger Render production deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_PRODUCTION_DEPLOY_HOOK_URL }}&ref=${{ github.sha }}"
      # See frontend-ci-cd.yml for why this polls /version.txt.
      - name: Wait for the new commit to go live
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 40); do
            live_commit="$(curl -fsS "$FRONTEND_URL/version.txt" || true)"
            echo "Attempt $i: live commit is ${live_commit:-<none>}, waiting for $EXPECTED_SHA"
            case "$live_commit" in
              "$EXPECTED_SHA"*) echo "New commit is live."; exit 0 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for commit $EXPECTED_SHA to go live."
          exit 1
