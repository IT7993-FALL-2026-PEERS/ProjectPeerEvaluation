name: Image build and push

# Builds the backend and frontend images from their Dockerfiles, starts them with Compose, checks
# /api/health, and only then pushes both to GitHub Container Registry (backlog CICD-28). This is the
# first job Donald's cd.yml calls. Per the Docker ADR (option C) the images are built, pushed and
# tested, while Render still builds from the same commit.
#
#   jobs:
#     images:
#       uses: ./.github/workflows/image-build.yml
#       permissions:
#         contents: read
#         packages: write      # a called workflow cannot have more than its caller grants
#
# Both images get the same tag: the full commit SHA. There is no `latest` tag, anywhere.
#
# workflow_dispatch is there so the workflow can be run on its own from a branch (Actions tab >
# Image build and push > Run workflow) without waiting for cd.yml.

on:
  workflow_call:
    inputs:
      frontend_api_url:
        description: >-
          URL the browser uses for the API. Compiled into the frontend image at build time, so it
          is public; never put a secret in it.
        type: string
        required: false
        default: http://localhost:5000/api
    outputs:
      tag:
        description: The tag both images were pushed with (the commit SHA).
        value: ${{ jobs.images.outputs.tag }}
      backend_image:
        description: Backend image with its tag, e.g. ghcr.io/owner/repo/backend:<sha>.
        value: ${{ jobs.images.outputs.backend_image }}
      frontend_image:
        description: Frontend image with its tag.
        value: ${{ jobs.images.outputs.frontend_image }}
      backend_digest:
        description: Digest of the pushed backend image (sha256:...), for the release record.
        value: ${{ jobs.images.outputs.backend_digest }}
      frontend_digest:
        description: Digest of the pushed frontend image.
        value: ${{ jobs.images.outputs.frontend_digest }}
  workflow_dispatch:
    inputs:
      frontend_api_url:
        description: URL the browser uses for the API (compiled into the frontend image).
        type: string
        required: false
        default: http://localhost:5000/api

permissions:
  contents: read

jobs:
  images:
    name: Build, test and push images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The only job in the repo that can write packages, and only this one gets the permission.
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      backend_image: ${{ steps.names.outputs.backend_image }}
      frontend_image: ${{ steps.names.outputs.frontend_image }}
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
      frontend_digest: ${{ steps.digests.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Registry paths must be lower case, and the organisation name is not (IT7993-FALL-2026-PEERS).
      - name: Work out the image names
        id: names
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${GITHUB_SHA}"
          case "$tag" in
            latest|"") echo "Refusing to use '$tag' as an image tag." >&2; exit 1 ;;
          esac
          {
            echo "tag=${tag}"
            echo "backend_image=ghcr.io/${repo}/backend:${tag}"
            echo "frontend_image=ghcr.io/${repo}/frontend:${tag}"
          } >> "$GITHUB_OUTPUT"

      # Same step a new teammate runs: creates the root .env with a random JWT_SECRET.
      - name: Create .env (scripts/setup.js)
        run: node scripts/setup.js --env-only

      # docker-compose.yml reads BACKEND_IMAGE and FRONTEND_IMAGE, so the images Compose builds
      # and starts are the ones that get pushed, not a second build of the same thing.
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 300
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend_image }}
          FRONTEND_API_URL: ${{ inputs.frontend_api_url }}
          # Baked into the backend image; /api/health reports it (CICD-73).
          GIT_COMMIT: ${{ github.sha }}

      - name: Smoke check (backend and frontend)
        run: bash scripts/verify-env.sh

      # The health route answers 503 when MongoDB is not connected; this also checks the body.
      - name: Health body reports the database connected
        run: |
          body=$(curl -sf http://localhost:5000/api/health)
          echo "$body"
          echo "$body" | grep -q '"status":"OK"'
          # The image reports the commit it was built from, so CD can wait for it after a deploy.
          echo "$body" | grep -q "\"commit\":\"${GITHUB_SHA}\""

      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker compose ps -a && docker compose logs --no-color --tail 100
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend_image }}

      - name: Stop the stack
        if: ${{ always() }}
        run: docker compose down -v
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend_image }}

      # Only reached when every check above passed, so a failed build never leaves an image behind.
      # The token is used here and nowhere earlier. It goes in on stdin, never on the command line.
      - name: Log in to ghcr.io
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A tag is never overwritten: the digest is the artifact's identity (CICD-73). When a commit's tag is
      # already in the registry (CD run again for the same commit), this run keeps the image that is there
      # and the summary reports its digest, so a second build of the same commit can never replace it.
      - name: Push the images that are not in the registry yet
        run: |
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            if answer=$(docker buildx imagetools inspect "$image" 2>&1); then
              echo "::notice::${image} is already in ghcr.io. Tags are never overwritten, so this run keeps that image."
            elif echo "$answer" | grep -qiE 'no such manifest|manifest unknown|name unknown|not found'; then
              docker push "$image"
            else
              # A rate limit, a network error or a refused login must not be read as "not there yet"
              echo "::error::Could not tell whether ${image} is already in ghcr.io: ${answer}"
              exit 1
            fi
          done
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend_image }}

      # Names, tag and digests for Donald's release record.
      - name: Image summary
        id: digests
        run: |
          # From the registry, so the digest is the one of the image that is there (pushed now or earlier)
          digest_of() { docker buildx imagetools inspect "$1" | awk '/^Digest:/ { print $2; exit }'; }
          backend_digest="@$(digest_of "$BACKEND_IMAGE")"
          frontend_digest="@$(digest_of "$FRONTEND_IMAGE")"
          case "${backend_digest#@}" in sha256:*) ;; *) echo "::error::Could not read the backend digest from the registry."; exit 1 ;; esac
          case "${frontend_digest#@}" in sha256:*) ;; *) echo "::error::Could not read the frontend digest from the registry."; exit 1 ;; esac
          { echo "backend_digest=${backend_digest#*@}"; echo "frontend_digest=${frontend_digest#*@}"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Images pushed to ghcr.io"
            echo ""
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            echo "| \`${BACKEND_IMAGE%:*}\` | \`${TAG}\` | \`${backend_digest#*@}\` |"
            echo "| \`${FRONTEND_IMAGE%:*}\` | \`${TAG}\` | \`${frontend_digest#*@}\` |"
            echo ""
            echo "Commit \`${TAG}\`. Both images were started with Compose and \`/api/health\` reported the database connected and this commit before the push. An image already in the registry is kept, never overwritten."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BACKEND_IMAGE: ${{ steps.names.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ steps.names.outputs.frontend_image }}
          TAG: ${{ steps.names.outputs.tag }}

      # After the summary on purpose: the digests are read from the registry, which needs the login.
      - name: Log out of ghcr.io
        if: ${{ always() }}
        run: docker logout ghcr.io
