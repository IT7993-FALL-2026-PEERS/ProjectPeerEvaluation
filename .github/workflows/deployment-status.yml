name: Deployment status

# Reusable. cd.yml calls it after its deploy job, even when the deploy failed or never ran because the
# image build failed, so every CD run that built or deployed shows a "Deployment status" section in its
# summary and keeps deployment-status.json as an artifact (backlog CICD-29); a run that stands down (main
# moved on) has none. cd.yml also calls it after a rollback. It does not deploy anything and needs no token.
#
#   report:
#     needs: [prepare, images, deploy]
#     if: ${{ !cancelled() && (needs.deploy.result != 'skipped' || needs.images.result == 'failure') }}
#     uses: ./.github/workflows/deployment-status.yml
#     with:
#       environment: staging
#       result: ${{ needs.deploy.result }}
#       url: https://<staging frontend>
#       health_url: https://<staging backend>/api/health
#       image_tag: ${{ needs.images.outputs.tag }}
#       backend_image: ghcr.io/<owner>/<repo>/backend:<sha>@sha256:<digest>   # image mode only

on:
  workflow_call:
    inputs:
      environment:
        description: Name shown in the report, e.g. staging.
        type: string
        required: true
      result:
        description: Result of the deploy job (success, failure, cancelled, skipped or abandoned).
        type: string
        required: true
      url:
        description: Public URL of the deployed app.
        type: string
        required: false
        default: ""
      health_url:
        description: Backend /api/health URL. When set and the deploy succeeded, it must answer OK.
        type: string
        required: false
        default: ""
      image_tag:
        description: Tag of the images that were deployed (the commit SHA).
        type: string
        required: false
        default: ""
      backend_image:
        description: >-
          Backend image that was deployed, pinned to its digest (image mode only), e.g.
          ghcr.io/owner/repo/backend:<sha>@sha256:... Empty when the backend was built from source.
        type: string
        required: false
        default: ""
      commit:
        description: Commit that was deployed. Defaults to the commit the run started from.
        type: string
        required: false
        default: ""
      frontend_commit:
        description: >-
          Frontend commit, when it can differ from `commit` (a rollback restores each service's own
          recorded commit). When set, `commit` is reported as the backend commit.
        type: string
        required: false
        default: ""
      release:
        description: The rc-* release that was restored (rollbacks only).
        type: string
        required: false
        default: ""
      note:
        description: Why nothing was deployed, when that is not plain from the result (e.g. the image build failed).
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    name: Deployment status
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Report deployment status
        run: node scripts/deployment-status.js reports/deployment-status.json
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          RESULT: ${{ inputs.result }}
          URL: ${{ inputs.url }}
          HEALTH_URL: ${{ inputs.health_url }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          BACKEND_IMAGE: ${{ inputs.backend_image }}
          COMMIT: ${{ inputs.commit || github.sha }}
          FRONTEND_COMMIT: ${{ inputs.frontend_commit }}
          RELEASE: ${{ inputs.release }}
          NOTE: ${{ inputs.note }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Upload deployment status
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-status-${{ inputs.environment }}
          path: reports/deployment-status.json
          retention-days: 90
          if-no-files-found: ignore
