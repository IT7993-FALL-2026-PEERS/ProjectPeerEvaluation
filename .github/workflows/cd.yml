name: CD

# A manual rollback run is titled with its tag, so Manual Rollback (manual-rollback.yml, CICD-78) can find the run it
# started and the Actions list says what each run is for. Any other run gets the default title (the empty string).
run-name: "${{ inputs.rollback_to != '' && format('CD: roll back to {0}', inputs.rollback_to) || '' }}"

# Delivery pipeline for staging (backlog CICD-12 and CICD-28). Runs after CI passes on a push to main:
#
#   prepare -> images -> deploy -> smoke -> release           (and rollback if deploy or smoke fails)
#                          \-> report (deployment status)
#
#   prepare  works out the commit, the mode and the previous good release (rollback target)
#   images   image-build.yml: builds, health-checks and pushes both images to ghcr.io, tagged with the SHA
#   deploy   each service's Render deploy hook for that commit, then waits until the service reports it
#   smoke    staging-regression.yml: health, frontend and the Playwright tests tagged @staging
#   release  an rc-* tag and a GitHub release whose record lists both components' commits, the images,
#            the smoke result and how to recover. Only when every step before it passed.
#   rollback redeploys the previous release's commits when deploy or smoke failed. The run still fails.
#
# The release stages (images, smoke, release, rollback) are switched off until the repository variable
# CD_RELEASE is "on" (Settings > Secrets and variables > Actions > Variables). While it is off, deploy
# works as it does today (CICD-12) and prepare writes a dry-run plan of the rest to the run summary.
#
# Render's autoDeployTrigger is off in render.yaml, so this workflow is the only thing that deploys.
# A service is skipped when no file it uses changed since the commit that is live, which saves Render
# build minutes (scripts/render-deploy.js), so backend and frontend can be on different commits.
#
# The backend can be deployed two ways, chosen by the repository variable BACKEND_DEPLOY, which must be
# exactly "source" or "image" (anything else, or unset, fails prepare before anything is deployed):
#   source  Render builds the commit itself (the hook gets ref=<sha>). The frontend always works this way.
#   image   Render runs the backend Docker image the images job built, health-checked and pushed, by its
#           digest (the hook gets imgURL=<image>@sha256:...). After the smoke tests pass, the `staging` tag
#           of the backend image is moved to that digest, which is what Render's configured image points
#           at, so a restart never brings back an older version (CICD-73). Rollback goes back to the
#           digest recorded in the release.
#
# Secrets, in the `staging` environment (Settings > Environments), never as repository secrets:
#   RENDER_BACKEND_DEPLOY_HOOK_URL   Render > peers-backend-staging > Settings > Deploy Hook
#   RENDER_FRONTEND_DEPLOY_HOOK_URL  Render > peers-frontend-staging > Settings > Deploy Hook
# A hook URL works like a password: anyone who has it can deploy. Regenerate it in Render if it leaks.
#
# By hand (Actions > CD > Run workflow, on main): redeploy main, with "force" to deploy even when nothing
# changed, or set "rollback_to" to an rc-* tag to redeploy that release instead. The easier way to roll back is
# Actions > Manual Rollback (manual-rollback.yml, CICD-78): paste the tag and click Run; it starts this workflow.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Deploy both services even when no file they use changed.
        type: boolean
        default: false
      rollback_to:
        description: An rc-* tag. Redeploys that release's commits instead of main.
        type: string
        default: ""

# One deploy at a time. A newer run waits instead of cancelling one that is halfway through a deploy.
concurrency:
  group: cd-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  STAGING_URL: https://peers-frontend-staging.onrender.com
  STAGING_API_URL: https://peers-backend-staging.onrender.com/api

jobs:
  prepare:
    name: Prepare
    # Only a CI run for a push to main, and only when it passed. Manual runs only from main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # actions: read, to find the CI run of the commit and (for the record) its run link. packages: read, to
    # check that a rollback target's image still exists in ghcr.io.
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      ci_run_id: ${{ steps.ci.outputs.run_id }}
      ci_run_url: ${{ steps.ci.outputs.run_url }}
      sha: ${{ steps.what.outputs.sha }}
      stale: ${{ steps.what.outputs.stale }}
      release: ${{ steps.what.outputs.release }}
      backend_mode: ${{ steps.what.outputs.backend_mode }}
      previous_tag: ${{ steps.previous.outputs.tag }}
      previous_backend: ${{ steps.previous.outputs.backend }}
      previous_frontend: ${{ steps.previous.outputs.frontend }}
      previous_backend_image: ${{ steps.previous.outputs.backend_image }}
      previous_backend_digest: ${{ steps.previous.outputs.backend_digest }}
      previous_backend_reports_commit: ${{ steps.previous.outputs.backend_reports_commit }}
      previous_backend_ref: ${{ steps.previous.outputs.backend_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Every job works on main as it is now (github.sha), never on a checkout of another ref. When main
      # has moved on since CI started, this run stands down: the CD run for the newer commit deploys it.
      - name: Work out the commit and the mode
        id: what
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          MAIN_SHA: ${{ github.sha }}
          CD_RELEASE: ${{ vars.CD_RELEASE }}
          BACKEND_DEPLOY: ${{ vars.BACKEND_DEPLOY }}
        run: |
          # Fail closed: a missing or misspelled value must never pick a kind of deploy by accident.
          if [ "$BACKEND_DEPLOY" != source ] && [ "$BACKEND_DEPLOY" != image ]; then
            echo "::error::The repository variable BACKEND_DEPLOY must be exactly \"source\" or \"image\" (Settings > Secrets and variables > Actions > Variables). It is \"${BACKEND_DEPLOY}\"."
            exit 1
          fi
          stale=false
          if [ "$SHA" != "$MAIN_SHA" ]; then
            stale=true
            echo "::notice::main has moved on to ${MAIN_SHA:0:7}. The CD run for that commit deploys it."
          fi
          release=off
          [ "$CD_RELEASE" = "on" ] && release=on
          { echo "sha=${SHA}"; echo "stale=${stale}"; echo "release=${release}"; echo "backend_mode=${BACKEND_DEPLOY}"; } >> "$GITHUB_OUTPUT"

      # The CI run that tested this commit. After CI it's the run that triggered CD. A manual deploy
      # needs a CI run on main for the same commit that passed, so nothing untested reaches staging
      # (Khoa's review of #146). A manual rollback redeploys a release, which passed CI before.
      - name: Find the CI run that tested this commit
        id: ci
        if: ${{ inputs.rollback_to == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.what.outputs.sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -n "$EVENT_RUN_ID" ]; then
            { echo "run_id=${EVENT_RUN_ID}"; echo "run_url=${EVENT_RUN_URL}"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.html_url)"')
          if [ -z "$run" ]; then
            echo "::error::No successful CI run on main for ${SHA:0:7}. Wait for CI to pass (or re-run it), then run CD again."
            exit 1
          fi
          { echo "run_id=${run%% *}"; echo "run_url=${run#* }"; } >> "$GITHUB_OUTPUT"

      # The rollback target: the release named in rollback_to, or else the newest rc-* release that the
      # pipeline made. Tags that don't match rc-<date>-<time>-<sha7>, and hand-made releases (no CD run
      # link, smoke tests not passed), are skipped: scripts/release-record.js `previous` decides. When the
      # backend runs as an image, only a release whose backend image and digest were recorded counts, and
      # that image must still resolve in ghcr.io. This is checked here, before any service is changed.
      - name: Find the previous good release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          BACKEND_MODE: ${{ steps.what.outputs.backend_mode }}
        run: |
          pattern='^rc-[0-9]{8}-[0-9]{4}-[0-9a-f]{7}$'
          export REQUIRE_IMAGE=false
          [ "$BACKEND_MODE" = image ] && REQUIRE_IMAGE=true
          if [ -n "$ROLLBACK_TO" ]; then
            [[ "$ROLLBACK_TO" =~ $pattern ]] || { echo "::error::rollback_to must be an rc-* tag such as rc-20261105-1432-1a2b3c4."; exit 1; }
            candidates="$ROLLBACK_TO"
          else
            candidates=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              --jq '.[].tagName | select(startswith("rc-"))' | head -n 20)
          fi
          empty="tag=
          backend=
          frontend=
          backend_image=
          backend_digest=
          backend_reports_commit="
          found="$empty"
          unusable=""
          if [ "$REQUIRE_IMAGE" = true ]; then
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          fi
          for tag in $candidates; do
            [[ "$tag" =~ $pattern ]] || { echo "Skipping ${tag}: not an rc-<date>-<time>-<sha7> tag"; continue; }
            rm -rf previous
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern release-record.json --dir previous 2>/dev/null || { echo "Skipping ${tag}: no release record"; continue; }
            out=$(node scripts/release-record.js previous previous/release-record.json)
            if grep -q '^backend=.' <<< "$out"; then
              if [ "$REQUIRE_IMAGE" = true ]; then
                # The backend runs as an image: the recorded digest must still be in the registry.
                image=$(sed -n 's/^backend_image=//p' <<< "$out")
                digest=$(sed -n 's/^backend_digest=//p' <<< "$out")
                ref="${image%:*}@${digest}"
                # Only "not there" skips a release. A rate limit, a network error or a refused login must not
                # be read as "not there": it stops the job, as in image-build.yml's push step.
                if answer=$(docker buildx imagetools inspect "$ref" 2>&1); then
                  :
                elif grep -qiE 'no such manifest|manifest unknown|name unknown|not found' <<< "$answer"; then
                  echo "Skipping ${tag}: its backend image ${ref} is not in ghcr.io"
                  unusable="${tag}"
                  continue
                else
                  echo "::error::Could not tell whether ${ref} is in ghcr.io: ${answer}"
                  exit 1
                fi
                out="${out}
          backend_ref=${ref}"
              fi
              found="$out"; break
            fi
            echo "Skipping ${tag}: not a release the pipeline made"
            if [ "$REQUIRE_IMAGE" = true ]; then
              # Was it only missing its image? Then the message below can say so.
              if [ -z "$unusable" ] && REQUIRE_IMAGE=false node scripts/release-record.js previous previous/release-record.json | grep -q '^backend=.'; then unusable="${tag}"; fi
            fi
          done
          [ "$REQUIRE_IMAGE" = true ] && docker logout ghcr.io >/dev/null 2>&1
          echo "$found" | tee -a "$GITHUB_OUTPUT"
          if [ -n "$ROLLBACK_TO" ] && ! grep -q '^backend=.' <<< "$found"; then
            if [ -n "$unusable" ]; then
              echo "::error::${ROLLBACK_TO} has no backend image that can be redeployed: its release record does not show an image that reports its own commit (releases made before the image deploy do not), or the image is no longer in ghcr.io. Pick a newer release."
            else
              echo "::error::${ROLLBACK_TO} has no release record the pipeline made, so it can't be rolled back to."
            fi
            exit 1
          fi
          if [ -z "$ROLLBACK_TO" ] && [ -n "$unusable" ] && ! grep -q '^backend=.' <<< "$found"; then
            echo "::warning::No earlier release has a backend image that can be redeployed, so this run cannot roll the backend back if the deploy fails."
          fi

      - name: Plan
        env:
          SHA: ${{ steps.what.outputs.sha }}
          STALE: ${{ steps.what.outputs.stale }}
          RELEASE: ${{ steps.what.outputs.release }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          BACKEND_MODE: ${{ steps.what.outputs.backend_mode }}
        run: |
          short="${SHA:0:7}"
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "### CD plan for \`${short}\`"
            echo ""
            if [ "$STALE" = "true" ]; then
              echo "main has moved on since CI started, so this run does nothing. The run for the newer commit deploys it."
            elif [ -n "$ROLLBACK_TO" ]; then
              echo "Manual rollback: redeploy both services to the commits recorded in \`${ROLLBACK_TO}\`."
            else
              if [ "$RELEASE" = "on" ]; then
                echo "Release stages are on (CD_RELEASE)."
              else
                echo "Release stages are switched off (CD_RELEASE is not \"on\"), so only the deploy runs. The rest is a dry run."
              fi
              echo ""
              echo "| Stage | What this run does |"
              echo "|---|---|"
              if [ "$RELEASE" = "on" ]; then
                echo "| Images | build, check and push \`ghcr.io/${repo}/{backend,frontend}:${SHA}\` |"
              else
                echo "| Images | would build, check and push \`ghcr.io/${repo}/{backend,frontend}:${SHA}\` |"
              fi
              if [ "$BACKEND_MODE" = image ]; then
                echo "| Deploy | backend: run this run's image by digest (image mode); frontend: deploy \`${short}\` if its files changed; wait until each reports it |"
              else
                echo "| Deploy | deploy \`${short}\` to each service whose files changed, and wait until it reports it |"
              fi
              if [ "$RELEASE" = "on" ]; then
                echo "| Smoke tests | run Staging regression against ${STAGING_URL} |"
                echo "| Release | tag \`rc-<date>-<time>-${short}\` and publish its release record |"
                echo "| Rollback if deploy or smoke fails | ${PREVIOUS_TAG:-none yet: there is no earlier release} |"
              else
                echo "| Smoke tests | would run Staging regression against ${STAGING_URL} |"
                echo "| Release | would tag \`rc-<date>-<time>-${short}\` and publish its release record |"
                echo "| Rollback if deploy or smoke fails | would redeploy ${PREVIOUS_TAG:-nothing: there is no earlier release} |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: [prepare]
    if: >-
      needs.prepare.outputs.release == 'on' && needs.prepare.outputs.stale != 'true'
      && inputs.rollback_to == ''
    uses: ./.github/workflows/image-build.yml
    permissions:
      contents: read
      packages: write
    with:
      frontend_api_url: https://peers-backend-staging.onrender.com/api

  deploy:
    # No matrix value in the name: GitHub adds "(backend)" itself, and a skipped job would
    # otherwise show the expression unexpanded.
    name: Deploy to staging
    needs: [prepare, images]
    # images is skipped while CD_RELEASE is off, which must not stop the deploy.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.stale != 'true'
      && inputs.rollback_to == '' && contains(fromJSON('["success", "skipped"]'), needs.images.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://peers-frontend-staging.onrender.com
    strategy:
      # Deploy the other service even if one fails; the report shows both.
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      # main as it is now, not a checkout of another ref: the script that holds the hook secret only
      # ever runs from main. The deployed commit is in main's history, which is all the script reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the script can diff the live commit against the deployed one.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The expression below falls back to the frontend hook when the backend secret is empty, so
      # check the service's own secret first: a missing one fails here, by name, and never deploys
      # the wrong service.
      - name: Check this service's deploy hook secret is set
        env:
          SERVICE: ${{ matrix.service }}
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ "$SERVICE" = backend ]; then
            name=RENDER_BACKEND_DEPLOY_HOOK_URL; hook="$BACKEND_HOOK"
          else
            name=RENDER_FRONTEND_DEPLOY_HOOK_URL; hook="$FRONTEND_HOOK"
          fi
          if [ -z "$hook" ]; then
            echo "::error::The $name secret is empty or missing in the staging environment."
            exit 1
          fi

      # How this service is deployed. The frontend is always built from source. The backend follows
      # BACKEND_DEPLOY; in image mode it needs the digest of the image this run pushed and never falls
      # back to a source deploy.
      - name: Choose how this service is deployed
        id: mode
        env:
          SERVICE: ${{ matrix.service }}
          BACKEND_MODE: ${{ needs.prepare.outputs.backend_mode }}
          IMAGES_RESULT: ${{ needs.images.result }}
          BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
        run: |
          mode=source
          [ "$SERVICE" = backend ] && mode="$BACKEND_MODE"
          ref=""
          if [ "$mode" = image ]; then
            if [ "$IMAGES_RESULT" != success ]; then
              echo "::error::The backend is deployed as an image (BACKEND_DEPLOY=image) but the images job did not succeed (${IMAGES_RESULT}). Nothing was deployed. Turn CD_RELEASE on, or set BACKEND_DEPLOY to source."
              exit 1
            fi
            if ! [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The images job did not report a valid backend image digest. Nothing was deployed."
              exit 1
            fi
            ref="ghcr.io/${GITHUB_REPOSITORY,,}/backend@${BACKEND_DIGEST}"
          fi
          { echo "mode=${mode}"; echo "image_ref=${ref}"; } >> "$GITHUB_OUTPUT"

      - name: Deploy and wait until live
        run: node scripts/render-deploy.js
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ needs.prepare.outputs.sha }}
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
          IMAGE_REF: ${{ steps.mode.outputs.image_ref }}
          HOOK_URL: ${{ matrix.service == 'backend' && secrets.RENDER_BACKEND_DEPLOY_HOOK_URL || secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
          # Redeploy even when nothing changed, but never an older commit than the live one.
          FORCE: ${{ inputs.force || false }}

  # Provisional until the Render spike (CICD-73 Task 2) shows whether Render re-pulls a moved tag: the
  # deploy above is by digest, so this only keeps Render's configured image (`backend:staging`) on the
  # version that passed, which is what a restart or scale-out pulls. Image mode only.
  pointer:
    name: Move the staging image pointer
    needs: [prepare, images, deploy, smoke]
    if: >-
      !cancelled() && needs.prepare.outputs.backend_mode == 'image' && needs.smoke.result == 'success'
      && needs.deploy.result == 'success' && needs.images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job besides the image build that can write packages.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Log in to ghcr.io
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Registry paths are lower case; the organisation name is not.
      - name: Work out the image reference
        id: ref
        env:
          BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
        run: echo "image_ref=ghcr.io/${GITHUB_REPOSITORY,,}/backend@${BACKEND_DIGEST}" >> "$GITHUB_OUTPUT"

      # Moves only when staging reports this run's commit (a late run, or one that deployed nothing, leaves
      # the pointer where it is). If the move fails the run fails: Render's configured image is behind.
      - name: Point backend:staging at the image that passed
        run: node scripts/staging-pointer.js
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
          SMOKE_PASSED: "true"
          SHA: ${{ needs.prepare.outputs.sha }}
          HEALTH_URL: https://peers-backend-staging.onrender.com/api/health

      - name: Log out of ghcr.io
        if: ${{ always() }}
        run: docker logout ghcr.io

  smoke:
    needs: [prepare, deploy]
    if: ${{ !cancelled() && needs.prepare.outputs.release == 'on' && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/staging-regression.yml
    with:
      base_url: https://peers-frontend-staging.onrender.com
      api_url: https://peers-backend-staging.onrender.com/api

  release:
    name: Tag release candidate
    needs: [prepare, images, deploy, smoke, pointer]
    # Every stage before it passed, or there is no tag. In image mode that includes moving the backend:staging
    # pointer, so a published release always has Render's configured image on its backend; in source mode the
    # pointer job is skipped on purpose.
    if: >-
      !cancelled() && needs.prepare.outputs.release == 'on' && needs.images.result == 'success'
      && needs.deploy.result == 'success' && needs.smoke.result == 'success'
      && (needs.pointer.result == 'success'
          || (needs.prepare.outputs.backend_mode != 'image' && needs.pointer.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job that can write to the repository: it creates the tag and the release. actions: read
    # downloads the CI run's coverage reports for the record.
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The coverage CI measured for this commit. Missing reports are recorded as "not available".
      - name: Download CI coverage
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.prepare.outputs.ci_run_id }}
        run: |
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name coverage-backend --dir ci/backend || echo "::warning::No backend coverage in CI run ${CI_RUN_ID}"
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name coverage-frontend --dir ci/frontend || echo "::warning::No frontend coverage in CI run ${CI_RUN_ID}"

      # Fails, with no tag, when staging can't say which commit a service runs or no @staging test ran.
      - name: Write the release record
        id: record
        run: echo "tag=$(node scripts/release-record.js record release)" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          SMOKE_TESTS: ${{ needs.smoke.outputs.tests }}
          CI_RUN_URL: ${{ needs.prepare.outputs.ci_run_url }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
          BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.images.outputs.frontend_digest }}
          BACKEND_COVERAGE: ci/backend/coverage/lcov.info
          FRONTEND_COVERAGE: ci/frontend/coverage/coverage-summary.json
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          # When this run did not deploy the backend, the record keeps the artifact that is really running.
          PREVIOUS_BACKEND_COMMIT: ${{ needs.prepare.outputs.previous_backend }}
          PREVIOUS_BACKEND_IMAGE: ${{ needs.prepare.outputs.previous_backend_image }}
          PREVIOUS_BACKEND_DIGEST: ${{ needs.prepare.outputs.previous_backend_digest }}
          PREVIOUS_BACKEND_REPORTS_COMMIT: ${{ needs.prepare.outputs.previous_backend_reports_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # A pre-release: staging only. Production is out of scope (CICD-38).
      - name: Create the rc tag and release
        run: >-
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease
          --title "$TAG" --notes-file release/release-record.md release/release-record.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.record.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}

      # Milestone evidence. The GitHub release keeps the record for good; this copy is for the run.
      - name: Upload the release record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: release/
          retention-days: 90
          if-no-files-found: ignore

  rollback:
    name: Roll back
    needs: [prepare, deploy, smoke]
    # By hand (rollback_to), or when deploy or smoke failed and there is an earlier release to go back to.
    if: >-
      !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.previous_backend != ''
      && (inputs.rollback_to != ''
          || (needs.prepare.outputs.release == 'on'
              && (needs.deploy.result == 'failure' || needs.smoke.result == 'failure')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
      url: https://peers-frontend-staging.onrender.com
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The expression below falls back to the frontend hook when the backend secret is empty, so
      # check the service's own secret first: a missing one fails here, by name, and never deploys
      # the wrong service.
      - name: Check this service's deploy hook secret is set
        env:
          SERVICE: ${{ matrix.service }}
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ "$SERVICE" = backend ]; then
            name=RENDER_BACKEND_DEPLOY_HOOK_URL; hook="$BACKEND_HOOK"
          else
            name=RENDER_FRONTEND_DEPLOY_HOOK_URL; hook="$FRONTEND_HOOK"
          fi
          if [ -z "$hook" ]; then
            echo "::error::The $name secret is empty or missing in the staging environment."
            exit 1
          fi

      # In image mode the backend goes back to the image digest recorded in the release (prepare checked
      # that it still resolves, before anything was changed); the frontend is always a source deploy.
      - name: Choose how this service is rolled back
        id: mode
        env:
          SERVICE: ${{ matrix.service }}
          BACKEND_MODE: ${{ needs.prepare.outputs.backend_mode }}
          PREVIOUS_REF: ${{ needs.prepare.outputs.previous_backend_ref }}
        run: |
          mode=source
          [ "$SERVICE" = backend ] && mode="$BACKEND_MODE"
          ref=""
          if [ "$mode" = image ]; then
            if [ -z "$PREVIOUS_REF" ]; then
              echo "::error::The backend runs as an image but the release to go back to has no checked backend image. Nothing was rolled back."
              exit 1
            fi
            ref="$PREVIOUS_REF"
          fi
          { echo "mode=${mode}"; echo "image_ref=${ref}"; } >> "$GITHUB_OUTPUT"

      # ROLLBACK, the only mode that may deploy an older commit than the live one.
      - name: Redeploy ${{ needs.prepare.outputs.previous_tag }} and wait until live
        run: node scripts/render-deploy.js
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ matrix.service == 'backend' && needs.prepare.outputs.previous_backend || needs.prepare.outputs.previous_frontend }}
          DEPLOY_MODE: ${{ steps.mode.outputs.mode }}
          IMAGE_REF: ${{ steps.mode.outputs.image_ref }}
          HOOK_URL: ${{ matrix.service == 'backend' && secrets.RENDER_BACKEND_DEPLOY_HOOK_URL || secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
          ROLLBACK: "true"

  # A rollback is checked like a deploy: health and a deployment status report, then the smoke tests.
  rollback-report:
    needs: [prepare, rollback]
    if: ${{ !cancelled() && needs.rollback.result != 'skipped' }}
    uses: ./.github/workflows/deployment-status.yml
    with:
      environment: staging-rollback
      result: ${{ needs.rollback.result }}
      url: https://peers-frontend-staging.onrender.com
      health_url: https://peers-backend-staging.onrender.com/api/health
      commit: ${{ needs.prepare.outputs.previous_backend }}

  rollback-smoke:
    needs: [rollback]
    if: ${{ !cancelled() && needs.rollback.result == 'success' }}
    uses: ./.github/workflows/staging-regression.yml
    with:
      base_url: https://peers-frontend-staging.onrender.com
      api_url: https://peers-backend-staging.onrender.com/api

  # After a rollback that passed its smoke tests, the pointer goes back to the digest rolled back to.
  rollback-pointer:
    name: Move the staging image pointer back
    needs: [prepare, rollback, rollback-smoke]
    if: >-
      !cancelled() && needs.prepare.outputs.backend_mode == 'image' && needs.rollback.result == 'success'
      && needs.rollback-smoke.result == 'success' && needs.prepare.outputs.previous_backend_ref != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Log in to ghcr.io
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Point backend:staging at the image rolled back to
        run: node scripts/staging-pointer.js
        env:
          IMAGE_REF: ${{ needs.prepare.outputs.previous_backend_ref }}
          SMOKE_PASSED: "true"
          SHA: ${{ needs.prepare.outputs.previous_backend }}
          HEALTH_URL: https://peers-backend-staging.onrender.com/api/health

      - name: Log out of ghcr.io
        if: ${{ always() }}
        run: docker logout ghcr.io

  report:
    needs: [prepare, deploy]
    if: ${{ !cancelled() && needs.deploy.result != 'skipped' }}
    uses: ./.github/workflows/deployment-status.yml
    with:
      environment: staging
      result: ${{ needs.deploy.result }}
      url: https://peers-frontend-staging.onrender.com
      health_url: https://peers-backend-staging.onrender.com/api/health
      commit: ${{ needs.prepare.outputs.sha }}
