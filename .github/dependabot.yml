# Dependabot version updates: frontend, backend and GitHub Actions.
# Minor and patch updates are grouped into one PR per area each week, because
# every merge that touches package.json/package-lock.json triggers a Render build
# and the workspace only has 500 build minutes a month. Major updates still come
# as separate PRs so breaking changes are reviewed one at a time.
# Security updates are separate: turn on "Dependabot security updates" in the
# repository settings (Code security) to get those as soon as an advisory lands.
version: 2
updates:
  # Frontend (React app at the repo root)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    # Version updates only touch packages listed in package.json. This does not
    # affect security updates, which ignore `allow`. History: the frontend's
    # vulnerable transitive packages (svgo, postcss, webpack-dev-server, ...) were
    # pinned by react-scripts 5.0.1, so security updates for them failed, and each
    # failure posted a failed "Dependabot" check on the main commit that made
    # Render's checksPass trigger skip the staging deploy. react-scripts is gone
    # (Vite), so those alerts no longer apply (docs/security/security-policy.md);
    # if a security update fails again, dismiss it with a reason rather than let it
    # block deploys.
    allow:
      - dependency-type: direct
    # ESLint 10 breaks eslint-plugin-react 7.37 (lint crashes), so hold the major version
    # until that plugin supports it (docs/architecture/vite-migration.md, section 7).
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  # Backend (Express API)
  - package-ecosystem: npm
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows. Every action is pinned to a full commit
  # SHA with the release in a trailing comment ("@<sha> # v7.0.1"); Dependabot
  # bumps both the SHA and the comment together. Repository settings require
  # SHA pinning, so a workflow using a tag like @v7 will fail to start.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ["*"]

  # Base images. Nothing else watches the image tags in the Dockerfiles and the Compose
  # file; nginx 1.27 went out of support unnoticed before this was added. The tags are
  # floating (node:24-alpine), so this reports newer minor and major tags, not a patch
  # rebuilt under the same tag.
  - package-ecosystem: docker
    directories:
      - /
      - /src/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    ignore:
      # The runtime is Node 24 LTS to match .nvmrc and engines; moving to another Node
      # major is a decision, not an automatic update.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # We follow nginx's stable branch (even minor numbers, Dockerfile.frontend). The odd
      # ones are mainline. Add the next odd number here if Dependabot proposes it.
      - dependency-name: "nginx"
        versions: ["1.31.x", "1.33.x", "1.35.x"]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]

  # docker-compose.yml: the mongo image used for local runs and the Compose smoke test.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
