# nginx config for the PEERS frontend image.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: React Router owns paths such as /evaluate/:token.
  # Any path that is not a real file gets index.html (same idea as
  # public/_redirects and the rewrite rule in render.yaml).
  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets can be cached for a long time; index.html must not be.
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # No /api proxy on purpose: the browser calls the backend directly at
  # REACT_APP_API_URL (baked in at build time), and the backend's CORS list in
  # src/backend/index.js already allows http://localhost:3000. A proxy would
  # also require building with REACT_APP_API_URL=/api.
}
