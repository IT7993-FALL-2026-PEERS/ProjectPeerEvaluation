# Serves the built React app. Unknown paths fall back to index.html so
# client-side routes (e.g. /evaluate/<token>) work on refresh and deep links,
# the same rewrite render.yaml configures for the Render static site.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets never change for a given filename.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
